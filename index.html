<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Visites 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { --fond: #17130f; --texte: #fff8ef; --doux: rgba(255,244,230,.7); --accent: #e8b27a; }
  html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 20%, #2b2118 0%, var(--fond) 70%); }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: clamp(26px, 7vw, 40px); font-weight: 650; margin: 0 0 12px; letter-spacing: -.01em; }
  p { color: var(--doux); line-height: 1.55; margin: 0 0 10px; font-size: 16px; }
  i { display: block; width: 40px; height: 3px; background: var(--accent); border-radius: 3px; margin: 0 auto 22px; }
</style>
</head>
<body>
<main>
  <i></i>
  <h1>Visites 3D de logements neufs</h1>
  <p>Chaque logement se visite librement, depuis un simple lien, sur ordinateur comme sur téléphone.</p>
  <p>Les visites ne sont accessibles qu'à partir du lien reçu.</p>
</main>
</body>
</html>
